# F-Droid metadata recipe for submission to https://gitlab.com/fdroid/fdroiddata
# Place as: metadata/io.saier.overtone.yml

Categories:
  - Multimedia
License: GPL-3.0-or-later
AuthorName: Marc Saier
SourceCode: https://github.com/marcscodebase/overtone-android
IssueTracker: https://github.com/marcscodebase/overtone-android/issues
Changelog: https://github.com/marcscodebase/overtone-android/releases

AutoName: Overtone

RepoType: git
Repo: https://github.com/marcscodebase/overtone-android.git

Builds:
  - versionName: '0.1.0'
    versionCode: 1
    commit: v0.1.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y -t bookworm-backports golang-1.23-go
    gradle:
      - yes
    ndk: 27.2.12479018
    srclibs:
      - go@go1.24.2
    build:
      - pushd $$go$$/src
      - GOROOT_BOOTSTRAP=/usr/lib/go-1.23 ./make.bash
      - popd
      - export PATH="$$go$$/bin:$PATH"
      - export ANDROID_NDK_HOME="$$NDK$$"
      - ../wireguard-core/build-android.sh

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"([^"]+)"
CurrentVersion: '0.1.0'
CurrentVersionCode: 1
