name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache-dependency-path: wireguard-core/go.sum

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"

      - name: Run WireGuard Go unit tests
        working-directory: wireguard-core
        run: go test -v ./...

      - name: Build reproducible WireGuard native libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          chmod +x wireguard-core/build-android.sh
          ./wireguard-core/build-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests & assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
